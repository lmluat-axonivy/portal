name: Build and Publish Portal Schemas

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish schemas to GitHub Packages (master only)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: 3.10.0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check package version matches Portal
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          portal = ET.parse("AxonIvyPortal/portal/pom.xml").getroot()
          package = ET.parse(".github/workflows/portal-schemas/pom.xml").getroot()
          portal_version = portal.findtext("m:version", namespaces=ns)
          package_version = package.findtext("m:version", namespaces=ns)
          if not portal_version or portal_version != package_version:
              raise SystemExit(f"Version mismatch: Portal={portal_version}, package={package_version}")
          print(f"Building schemas for Portal {portal_version}")
          PY

      - name: Generate schemas
        run: >-
          mvn -B -ntp -f AxonIvyPortal/portal/pom.xml
          -Pjson.schema clean process-classes

      - name: Check generated JSON and schema references
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urljoin

          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          pom = ET.parse("AxonIvyPortal/portal/pom.xml").getroot()
          version = pom.findtext("m:version", namespaces=ns)
          base = pom.findtext("m:properties/m:json.schema.base.url", namespaces=ns)
          version_url = urljoin(base.rstrip("/") + "/", version + "/")
          directory = Path("AxonIvyPortal/portal/target/schemas") / version
          names = (
              "portal-dashboard-schema.json",
              "portal-custom-statistic-schema.json",
              "portal-dashboard-template-schema.json",
          )
          expected_ids = {urljoin(version_url, name) for name in names}

          def check_references(node):
              if isinstance(node, dict):
                  ref = node.get("$ref")
                  if ref is not None:
                      if not isinstance(ref, str):
                          raise ValueError(f"Invalid reference: {ref!r}")
                      if not ref.startswith("#") and ref.split("#", 1)[0] not in expected_ids:
                          raise ValueError(f"Unexpected cross-schema reference: {ref}")
                  for value in node.values():
                      check_references(value)
              elif isinstance(node, list):
                  for value in node:
                      check_references(value)

          for name in names:
              schema = json.loads((directory / name).read_text(encoding="utf-8"))
              if schema.get("$schema") != "https://json-schema.org/draft/2020-12/schema":
                  raise ValueError(f"Unexpected schema draft in {name}")
              if schema.get("$id") != urljoin(version_url, name):
                  raise ValueError(f"Unexpected schema ID in {name}")
              check_references(schema)
              print(f"Checked {name}")
          PY

      - name: Package schemas
        run: >-
          mvn -B -ntp -f .github/workflows/portal-schemas/pom.xml
          clean package

      - name: Check ZIP contents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archives = list(Path(".github/workflows/portal-schemas/target").glob("portal-schemas-*.zip"))
          if len(archives) != 1:
              raise SystemExit(f"Expected one schema ZIP, found {len(archives)}")
          expected = {
              "portal-dashboard-schema.json",
              "portal-custom-statistic-schema.json",
              "portal-dashboard-template-schema.json",
          }
          with ZipFile(archives[0]) as archive:
              if sorted(archive.namelist()) != sorted(expected):
                  raise ValueError(f"Unexpected ZIP contents: {archive.namelist()}")
              if archive.testzip() is not None:
                  raise ValueError("Corrupt ZIP entry")
          print(f"Checked {archives[0]}")
          PY

      - name: Upload schema ZIP and publishing POM
        uses: actions/upload-artifact@v4
        with:
          name: portal-schemas
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .github/workflows/portal-schemas/target/portal-schemas-*.zip
            .github/workflows/portal-schemas/pom.xml

  publish:
    if: ${{ inputs.publish && github.ref == 'refs/heads/master' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-portal-schemas
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: portal-schemas
          path: package

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: 3.10.0

      - name: Publish validated ZIP and POM
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B -ntp org.apache.maven.plugins:maven-deploy-plugin:3.1.3:deploy-file \
            -Dfile="$(find package/target -maxdepth 1 -name 'portal-schemas-*.zip' -type f)" \
            -DpomFile=package/pom.xml \
            -Dpackaging=zip \
            -DrepositoryId=github \
            -Durl=https://maven.pkg.github.com/lmluat-axonivy/portal
